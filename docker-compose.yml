services:
  postgres:
    image: postgres:16
    container_name: efcore-interceptor-db
    environment:
      POSTGRES_DB: efcore_interceptor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - efcore-interceptor-data:/var/lib/postgresql/data

volumes:
  efcore-interceptor-data:
